<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les locaux de l'agence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231c1917%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia%22 font-size=%2220%22 font-weight=%22700%22 fill=%22%23fffdf9%22 text-anchor=%22middle%22%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/agence.css">
</head>
<body>
<header class="barre">
  <div class="marque">
    <span class="logo" aria-hidden="true">A</span>
    <div>
      <strong>L'Agence</strong>
      <span class="sous">Evan, directeur</span>
    </div>
  </div>
  <label class="projet">
    <span>Projet</span>
    <select id="choix-projet" aria-label="Projet en cours"></select>
  </label>
  <nav class="actions">
    <button class="bouton principal" data-a="nouveau-brief">Nouveau brief</button>
    <button class="bouton" data-a="dossier">Dossier du projet</button>
    <button class="bouton" data-a="circuit">Le circuit</button>
    <button class="bouton discret" data-a="github" id="bouton-github">Envoyer sur GitHub</button>
    <button class="bouton icone" data-a="theme" aria-label="Changer de thème" title="Clair ou sombre"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
  </nav>
</header>

<main class="plateau">
  <section class="locaux" aria-label="Les locaux de l'agence">
    <div class="immeuble" id="immeuble">
      <div class="toit"><span>L'Agence</span></div>
      <div class="etage" data-etage="2">
        <div class="piece" data-piece="planning"><h3>Bureau du planning</h3><div class="bureaux"></div></div>
        <div class="piece" data-piece="crea"><h3>Salle de créa</h3><div class="bureaux"></div></div>
      </div>
      <div class="etage" data-etage="1">
        <div class="piece large" data-piece="openspace"><h3>Open space</h3><div class="bureaux"></div></div>
      </div>
      <div class="etage" data-etage="0">
        <div class="piece" data-piece="brief"><h3>Salle du brief</h3><div class="bureaux"></div></div>
        <div class="piece" data-piece="studio"><h3>Studio</h3><div class="bureaux"></div></div>
      </div>
      <div class="sol"></div>
      <div class="dossier-vol" id="dossier-vol" aria-hidden="true"></div>
    </div>
    <ol class="circuit" id="circuit" aria-label="Le circuit d'une recommandation"></ol>
    <p class="legende" id="legende">Clique sur un bureau pour écrire à son agent.</p>
  </section>

  <section class="chat" aria-label="Ton bureau">
    <div class="chat-tete">
      <div id="destinataire"></div>
      <button class="bouton discret petit" data-a="oublier" title="Effacer cette conversation">Effacer</button>
    </div>
    <div class="fil" id="fil" aria-live="polite"></div>
    <div class="travail" id="travail" hidden>
      <span class="points" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="travail-texte">L'agence travaille</span>
      <button class="bouton petit" data-a="arreter">Arrêter</button>
    </div>
    <form class="saisie" id="saisie">
      <textarea id="texte" rows="1" placeholder="Écris à l'agence… (Maj + Entrée : nouvelle ligne)" aria-label="Ton message"></textarea>
      <button class="bouton principal" type="submit">Envoyer</button>
    </form>
  </section>
</main>

<div class="fenetres" id="fenetres"></div>
<div class="voile" id="voile" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/agence.js"></script>
</body>
</html>
